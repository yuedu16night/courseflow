<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CourseFlow — Registration Orchestration Demo</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7280;
          --brand:#3454d1; --ok:#0f8a4d; --warn:#b45309; --bad:#b91c1c; --line:#e5e7eb; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:14px 24px; display:flex;
           justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; font-weight:600; }
  .who { font-size:13px; opacity:.9; }
  main { max-width:1100px; margin:20px auto; padding:0 16px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:var(--card); padding:8px 14px;
                 border-radius:8px; cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:18px; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:11px;
          font-weight:600; }
  .ENROLLED{background:#d1fae5;color:var(--ok)} .WAITLISTED{background:#fef3c7;color:var(--warn)}
  .VALIDATED{background:#dbeafe;color:var(--brand)} .REJECTED,.EXPIRED{background:#fee2e2;color:var(--bad)}
  .DROPPED,.CANCELLED{background:#e5e7eb;color:var(--muted)} .SUBMITTED{background:#ede9fe;color:#6d28d9}
  button.act { border:0; background:var(--brand); color:#fff; padding:6px 12px;
               border-radius:6px; cursor:pointer; font-size:12px; }
  button.act.gray { background:#6b7280; } button.act.red { background:var(--bad); }
  input,select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .muted { color:var(--muted); font-size:12px; }
  .banner { padding:9px 12px; border-radius:8px; font-size:13px; margin:10px 0; display:none; }
  .banner.ok{display:block;background:#d1fae5;color:var(--ok)}
  .banner.err{display:block;background:#fee2e2;color:var(--bad)}
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .login-box { max-width:420px; margin:80px auto; }
  pre.log { background:#0f172a; color:#a5f3a5; font-size:11px; padding:12px;
            border-radius:8px; max-height:260px; overflow:auto; }
</style>
</head>
<body>

<div id="loginView">
  <div class="card login-box">
    <h2 style="margin-bottom:4px">CourseFlow</h2>
    <p class="muted" style="margin-bottom:14px">Registration & Timetable Orchestration — demo</p>
    <div class="row"><input id="lu" placeholder="username" value="alice" style="flex:1"></div>
    <div class="row"><input id="lp" type="password" placeholder="password" value="alice123" style="flex:1"></div>
    <div class="row"><button class="act" style="flex:1" onclick="doLogin()">Sign in</button></div>
    <p class="muted">Accounts: alice/bob/charlie/dave (student) · carol (instructor,
    pwd +123 suffix each, e.g. carol123) · registrar/reg123 · admin/admin123</p>
    <div id="loginBanner" class="banner"></div>
  </div>
</div>

<div id="appView" style="display:none">
  <header>
    <h1>CourseFlow <span style="font-weight:300">| semester <span id="sem">2026FA</span></span></h1>
    <div class="who"><span id="whoami"></span> · <span id="phasePill"></span> ·
      <button class="act gray" onclick="logout()">logout</button></div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="banner" class="banner"></div>
    <div id="content"></div>
  </main>
</div>

<script>
let TOKEN=null, ME=null, PHASE=null;
const api = async (path, opts={}) => {
  const r = await fetch("/api"+path, {...opts,
    headers:{ "Content-Type":"application/json", ...(TOKEN?{Authorization:"Bearer "+TOKEN}:{}) , ...(opts.headers||{})}});
  const body = await r.json().catch(()=>({}));
  return {status:r.status, body};
};
const show = (ok,msg)=>{ const b=document.getElementById("banner");
  b.className="banner "+(ok?"ok":"err"); b.textContent=msg; setTimeout(()=>b.className="banner",4000); };

async function doLogin(){
  const r = await api("/auth/login",{method:"POST",body:JSON.stringify({username:lu.value,password:lp.value})});
  if(r.status!==200){ const b=document.getElementById("loginBanner"); b.className="banner err"; b.textContent="Login failed"; return; }
  TOKEN=r.body.token; ME=r.body; localStorage.token=TOKEN;
  document.getElementById("loginView").style.display="none";
  document.getElementById("appView").style.display="block";
  boot();
}
function logout(){ localStorage.clear(); location.reload(); }

async function boot(){
  document.getElementById("whoami").textContent = `${ME.full_name} (${ME.role})`;
  const r = await api("/auth/me",{headers:{Authorization:"Bearer "+TOKEN}});
  ME = {...ME, ...r.body};
  const pr = await api("/admin/phase");
  PHASE = pr.status===200 ? pr.body.phase : "pre_enrollment";
  document.getElementById("phasePill").innerHTML = `<span class="pill VALIDATED">${PHASE}</span>`;
  buildTabs(); render();
}

function buildTabs(){
  const tabs = { catalog:"Course Catalog", enroll:"Enroll", my:"My Registrations",
                 timetable:"My Timetable" };
  if(ME.role==="instructor") Object.assign(tabs,{roster:"Rosters"});
  if(["registrar","admin"].includes(ME.role))
    Object.assign(tabs,{admin:"Orchestration",audit:"Audit & Events"});
  if(ME.role==="admin") Object.assign(tabs,{users:"Users"});
  const el=document.getElementById("tabs"); el.innerHTML="";
  for(const [k,label] of Object.entries(tabs)){
    const b=document.createElement("button"); b.textContent=label; b.dataset.k=k;
    b.onclick=()=>{render(k)}; el.appendChild(b);
  }
  el.firstChild.classList.add("active");
}

async function render(tab){
  tab = tab || document.querySelector("#tabs .active")?.dataset.k || "catalog";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active",b.dataset.k===tab));
  const c = document.getElementById("content");
  if(tab==="catalog"){
    const [courses, sections] = await Promise.all([api("/courses"), api("/sections")]);
    c.innerHTML = `<div class="card"><h3>Catalog (immutable per semester, versioned)</h3>
      <table><tr><th>Code</th><th>Title</th><th>Credits</th><th>Prereqs</th><th>v</th></tr>
      ${courses.body.map(x=>`<tr><td><b>${x.code}</b></td><td>${x.title}</td><td>${x.credits}</td>
        <td>${x.prerequisites.join(", ")||"—"}</td><td>${x.catalog_version}</td></tr>`).join("")}</table></div>
      <div class="card"><h3>Sections — phase: <span class="pill VALIDATED">${PHASE}</span></h3>
      <table><tr><th>ID</th><th>Course</th><th>Sec</th><th>Instructor</th><th>Cap</th><th>Venue</th><th>Slots</th></tr>
      ${sections.body.map(s=>`<tr><td>${s.id}</td><td>${s.course_code}</td><td>${s.section_no}</td>
        <td>${s.instructor_name}</td><td>${s.capacity}</td><td>${s.venue}</td>
        <td>${s.slots.map(sl=>day(sl.day)+" "+hh(sl.start_min)+"–"+hh(sl.end_min)).join(", ")}</td></tr>`).join("")}
      </table></div>`;
  }
  if(tab==="enroll"){
    const sections = (await api("/sections")).body;
    c.innerHTML = `<div class="card"><h3>Enroll</h3><div class="row">
      <select id="sec">${sections.map(s=>`<option value="${s.id}">#${s.id} ${s.course_code}.${s.section_no} (cap ${s.capacity})</option>`).join("")}</select>
      <button class="act" onclick="enroll()">Submit enrollment request</button></div>
      <p class="muted">The request runs the full policy chain: duplicate → prerequisites (DAG) → timetable → credit limit, then either confirms a seat, joins the waitlist (FCFS), or is rejected with a reason code.</p></div>`;
  }
  if(tab==="my"){
    const mine = (await api("/enrollments/me")).body;
    c.innerHTML = `<div class="card"><h3>My registrations</h3><table>
      <tr><th>ID</th><th>Section</th><th>Semester</th><th>State</th><th>WL#</th><th>Reason</th><th></th></tr>
      ${mine.map(e=>`<tr><td>${e.id}</td><td>${e.section}</td><td>${e.semester}</td>
        <td><span class="pill ${e.state}">${e.state}</span></td><td>${e.waitlist_seq??"—"}</td>
        <td class="muted">${e.reason||""}</td>
        ${["ENROLLED","WAITLISTED","VALIDATED"].includes(e.state)
          ?`<td><button class="act red" onclick="drop(${e.id})">drop</button></td>`:"<td></td>"}</tr>`).join("")}
      </table></div>`;
  }
  if(tab==="timetable"){
    const grid = (await api("/timetable/me")).body;
    c.innerHTML = `<div class="card"><h3>Weekly timetable (conflict-free by construction)</h3>
      ${grid.length? `<table><tr><th>Day</th><th>Time</th><th>Course</th><th>Section</th><th>Venue</th></tr>
      ${grid.map(g=>`<tr><td>${day(g.day)}</td><td>${hh(g.start_min)}–${hh(g.end_min)}</td>
        <td><b>${g.course}</b></td><td>${g.section}</td><td>${g.venue}</td></tr>`).join("")}</table>`
      : `<p class="muted">No confirmed enrollments yet.</p>`}</div>`;
  }
  if(tab==="roster"){
    const sections = (await api("/sections")).body;
    c.innerHTML = `<div class="card"><h3>Section roster (row-level RBAC: own sections only)</h3>
      <div class="row"><select id="rsec">${sections.map(s=>`<option value="${s.id}">#${s.id} ${s.course_code}.${s.section_no} — ${s.instructor_name}</option>`).join("")}</select>
      <button class="act" onclick="loadRoster()">Load</button></div><div id="rosterOut"></div></div>`;
  }
  if(tab==="admin"){
    c.innerHTML = `<div class="card"><h3>Stage orchestration</h3>
      <p class="muted">Linear phase machine: pre_enrollment → allocation → add_drop → closed.
      Each advance writes a handover snapshot for the next stage.</p>
      <div class="row"><button class="act" onclick="advancePhase()">Advance phase</button>
      <button class="act" onclick="runAllocation()">Run batch allocation (seeded lottery)</button></div></div>
      <div class="grid2"><div class="card"><h3>All enrollments</h3><div id="allEnr" class="muted">…</div></div>
      <div class="card"><h3>Recent events</h3><div id="evLog" class="muted">…</div></div></div>`;
    loadAdmin();
  }
  if(tab==="audit"){
    const [audit, events] = await Promise.all([api("/admin/audit"), api("/admin/events")]);
    c.innerHTML = `<div class="grid2">
      <div class="card"><h3>Append-only enrollment audit</h3><table>
      <tr><th>ID</th><th>Enr</th><th>From → To</th><th>Actor</th><th>Reason</th></tr>
      ${audit.body.slice(0,40).map(a=>`<tr><td>${a.id}</td><td>${a.enrollment_id}</td>
        <td>${a.from_state??"∅"} → <b>${a.to_state}</b></td><td>${a.actor}</td>
        <td class="muted">${a.reason||""}</td></tr>`).join("")}</table></div>
      <div class="card"><h3>Event log</h3><table>
      <tr><th>ID</th><th>Type</th><th>Payload</th></tr>
      ${events.body.slice(0,40).map(e=>`<tr><td>${e.id}</td><td>${e.type}</td>
        <td class="muted" style="max-width:280px;overflow:hidden;text-overflow:ellipsis">${e.payload}</td></tr>`).join("")}
      </table></div></div>`;
  }
  if(tab==="users"){
    const users = (await api("/users")).body;
    c.innerHTML = `<div class="card"><h3>Users</h3><table><tr><th>Username</th><th>Role</th><th>Name</th></tr>
      ${users.map(u=>`<tr><td>${u.username}</td><td>${u.role}</td><td>${u.full_name}</td></tr>`).join("")}</table>
      <h3 style="margin-top:14px">Create user</h3>
      <div class="row"><input id="nu" placeholder="username"><input id="np" placeholder="password">
      <select id="nr"><option>student</option><option>instructor</option><option>registrar</option><option>admin</option></select>
      <input id="nn" placeholder="full name"><button class="act" onclick="createUser()">Create</button></div></div>`;
  }
}

const day = d => ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][d-1];
const hh  = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

async function enroll(){
  const r = await api("/enrollments",{method:"POST",body:JSON.stringify({section_id:+document.getElementById("sec").value})});
  show(r.status===200, r.status===200? `Request state: ${r.body.state}${r.body.waitlist_seq?" (waitlist #"+r.body.waitlist_seq+")":""}`
    : `Rejected: ${r.body.detail?.code} — ${r.body.detail?.message}`);
  render("enroll");
}
async function drop(id){
  const r = await api(`/enrollments/${id}/drop`,{method:"POST"});
  show(r.status===200, r.status===200?`Dropped. State: ${r.body.state}`:`Error: ${r.body.detail||r.body}`);
  render("my");
}
async function loadRoster(){
  const r = await api(`/sections/${document.getElementById("rsec").value}/roster`);
  document.getElementById("rosterOut").innerHTML = r.status===200
    ? `<table><tr><th>Student</th><th>Name</th></tr>${r.body.enrolled.map(s=>`<tr><td>${s.username}</td><td>${s.full_name}</td></tr>`).join("")||"<tr><td colspan=2 class=muted>empty</td></tr>"}</table>`
    : `<p class="muted">HTTP ${r.status}: ${JSON.stringify(r.body.detail||r.body)}</p>`;
}
async function advancePhase(){
  const r = await api("/admin/phase/advance",{method:"POST"});
  if(r.status===200){ PHASE=r.body.phase; document.getElementById("phasePill").innerHTML=`<span class="pill VALIDATED">${PHASE}</span>`;
    show(true,"Phase advanced — handover snapshot stored"); bootTabsKeepAdmin(); }
  else show(false, `${r.body.detail?.code}: ${r.body.detail?.message}`);
}
async function bootTabsKeepAdmin(){ buildTabs(); render("admin"); }
async function runAllocation(){
  const r = await api("/admin/allocation/run?seed=42",{method:"POST"});
  show(r.status===200, r.status===200?"Allocation executed":"Error: "+JSON.stringify(r.body.detail||r.body));
  loadAdmin();
}
async function loadAdmin(){
  const [all, ev] = await Promise.all([api("/enrollments"), api("/admin/events")]);
  document.getElementById("allEnr").innerHTML = `<table><tr><th>Student</th><th>Section</th><th>State</th></tr>
    ${all.body.map(e=>`<tr><td>${e.student}</td><td>${e.section}</td><td><span class="pill ${e.state}">${e.state}</span></td></tr>`).join("")}</table>`;
  document.getElementById("evLog").innerHTML = `<table>${ev.body.slice(0,12).map(e=>`<tr><td>${e.type}</td><td class="muted">${e.payload.slice(0,80)}</td></tr>`).join("")}</table>`;
}
async function createUser(){
  const r = await api("/users",{method:"POST",body:JSON.stringify({username:nu.value,password:np.value,full_name:nn.value,role:nr.value})});
  show(r.status===200, r.status===200?"User created":JSON.stringify(r.body.detail||r.body));
  render("users");
}

if(localStorage.token){ TOKEN=localStorage.token;
  api("/auth/me").then(r=>{ if(r.status===200){ ME=r.body;
    document.getElementById("loginView").style.display="none";
    document.getElementById("appView").style.display="block";
    document.getElementById("whoami").textContent=`${ME.full_name} (${ME.role})`;
    api("/admin/phase").then(p=>{ if(p.status===200){PHASE=p.body.phase;
      document.getElementById("phasePill").innerHTML=`<span class="pill VALIDATED">${PHASE}</span>`;}
      buildTabs(); render(); });
  } else localStorage.clear(); });
}
</script>
</body>
</html>
